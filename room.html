<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' wss://nos.lol wss://relay.damus.io wss://relay.primal.net wss://relay.snort.social wss://relay.nostr.band wss://purplepag.es wss://nostr.wellorder.net; img-src 'self' blob: data:; media-src 'self' blob:;">
  <title>ShuntCall - Protocol Room</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    /* Custom Design Elements matching index.html */
    :root {
      color-scheme: dark;
    }
    body {
      font-family: 'Space Grotesk', sans-serif;
      background-color: #050505;
      color: #e5e5e5;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    
    /* P2P Network Grid Background */
    .bg-grid {
      background-size: 32px 32px;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    }

    /* Minimalist technical inputs */
    .tech-input {
      background: rgba(10, 10, 10, 0.8);
      border: 1px solid #262626;
      transition: all 0.2s ease;
    }
    .tech-input:focus {
      border-color: #ffffff;
      outline: none;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
    }

    /* Solid & Outline buttons */
    .btn-solid {
      background: #ffffff;
      color: #000000;
      border: 1px solid #ffffff;
      transition: all 0.2s ease;
    }
    .btn-solid:hover {
      background: #e5e5e5;
      transform: translateY(-1px);
    }
    .btn-outline {
      background: transparent;
      color: #ffffff;
      border: 1px solid #333333;
      transition: all 0.2s ease;
    }
    .btn-outline:hover {
      border-color: #ffffff;
      background: rgba(255, 255, 255, 0.05);
    }

    /* Video Container specific */
    .video-overlay {
      background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 100%);
    }
    
    /* Active states for toolbar */
    .toolbar-btn {
      transition: all 0.2s ease;
    }
    .toolbar-btn.active {
      background: #ffffff;
      color: #000000;
      border-color: #ffffff;
    }

    /* Connection quality overlay */
    .quality-badge {
      padding: 2px 6px;
      border-radius: 2px;
      font-size: 9px;
      font-family: 'JetBrains Mono', monospace;
    }
    .quality-good { color: #4ade80; border: 1px solid #166534; background: rgba(22,101,52,0.2); }
    .quality-medium { color: #facc15; border: 1px solid #854d0e; background: rgba(133,77,14,0.2); }
    .quality-poor { color: #f87171; border: 1px solid #991b1b; background: rgba(153,27,27,0.2); }

    /* File transfer notification */
    .file-transfer-bar {
      height: 3px;
      background: #333;
      border-radius: 2px;
      overflow: hidden;
    }
    .file-transfer-bar-fill {
      height: 100%;
      background: #fff;
      transition: width 0.3s ease;
    }

    /* Copy protection: prevent selection on sensitive UI */
    .no-select {
      user-select: none;
      -webkit-user-select: none;
    }

    /* Screenshot protection overlay */
    #screenshotOverlay {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.2em;
    }

    /* Mobile responsive */
    @media (max-width: 768px) {
      .toolbar-btn {
        width: 44px !important;
        height: 44px !important;
      }
      #chatPanel {
        width: 100% !important;
      }
      #debugPanel {
        right: 1rem !important;
        left: 1rem !important;
        max-width: none !important;
      }
      header .max-w-\[1600px\] {
        padding: 0 1rem;
      }
    }

    @media (max-width: 480px) {
      .toolbar-btn {
        width: 40px !important;
        height: 40px !important;
      }
      #togglePiP, #shareFile {
        display: none !important;
      }
    }
  </style>
</head>
<body class="bg-grid selection:bg-white selection:text-black h-screen overflow-hidden flex flex-col relative">
  
  <div id="screenshotOverlay">Session Paused — Tab Hidden</div>
  <div id="passwordModal" class="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center z-[100] hidden">

  <div id="loadingScreen" class="fixed inset-0 z-50 flex items-center justify-center bg-black/90 backdrop-blur-sm hidden">

  <div id="room" class="hidden flex-1 flex flex-col h-full w-full">

  <script src="https://unpkg.com/nostr-tools@2.7.2/lib/nostr.bundle.js"></script>
  <script type="module">
     import { ShuntCallCrypto } from './js/crypto.js';
     import { Nostr } from './js/nostr.js';
     import { NostrSignaling } from './js/nostr-signaling.js';
     import { ShuntCallWebRTC } from './js/webrtc.js';
     import { ShuntCallRelayTree } from './js/relay-tree.js';
     
     // Expose modules globally
     window.ShuntCallCrypto = ShuntCallCrypto;
     window.Nostr = Nostr;
     window.NostrSignaling = NostrSignaling;
     window.ShuntCallWebRTC = ShuntCallWebRTC;
     window.ShuntCallRelayTree = ShuntCallRelayTree;
  </script>

  <script>
    // Security check for getUserMedia
    (function() {
      const isSecure = window.location.protocol === 'https:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
      if (!isSecure) {
        document.write('<div style="background:#000;border-bottom:1px solid #ef4444;color:#ef4444;padding:1rem;text-align:center;font-family:monospace;font-size:12px;text-transform:uppercase;z-index:9999;position:relative;">[System Alert] HTTPS required for secure media transmission.</div>');
      }
    })();

    const App = {
      roomId: null,
      password: null,
      roomTag: null,
      localStream: null,
      peers: new Map(),
      signaling: null,
      webrtc: null,
      isAudioEnabled: true,
      isVideoEnabled: true,
      isScreenSharing: false,
      screenTrack: null,
      peerMuteStates: new Map(),
      chatMessages: [],
      chatOpen: false,
      nickname: '',
      peerNicknames: new Map(),
      encryptionKey: null,
      fileTransfers: new Map(),
      chatExpiry: 0,

      async init() {
        const params = new URLSearchParams(window.location.search);
        this.roomId = params.get('room');
        
        if (!this.roomId) {
          window.location.href = 'index.html';
          return;
        }

        document.getElementById('roomIdDisplay').textContent = this.roomId;

        // Check for password in URL fragment (#pw=...)
        const hash = window.location.hash;
        if (hash && hash.startsWith('#')) {
          const fragmentPassword = decodeURIComponent(hash.slice(1));
          if (fragmentPassword) {
            // Clear fragment from URL immediately (security)
            history.replaceState(null, '', window.location.pathname + window.location.search);
            // Auto-initialize without showing password modal
            this.password = fragmentPassword;
            await this.initRoom();
            return;
          }
        }

        this.setupPasswordModal();
      },

      setupPasswordModal() {
        // Check for room hash in URL (password never stored in sessionStorage)
        const storedRoomId = sessionStorage.getItem('shuntcall_roomId');
        
        if (storedRoomId === this.roomId) {
          sessionStorage.removeItem('shuntcall_roomId');
        }

        // Always show the password modal — password is never persisted
        document.getElementById('passwordModal').style.display = 'flex';
        document.getElementById('passwordModal').classList.remove('hidden');
        
        const input = document.getElementById('roomPassword');
        const submit = document.getElementById('submitPassword');
        const error = document.getElementById('passwordError');

        submit.addEventListener('click', async () => {
          const password = input.value.trim();
          if (!password) {
            error.textContent = 'Decryption key is required.';
            error.classList.remove('hidden');
            return;
          }
          
          this.password = password;
          document.getElementById('passwordModal').style.display = 'none';
          await this.initRoom();
        });

        input.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') {
            submit.click();
          }
        });

        // Password strength meter for room password
        input.addEventListener('input', (e) => {
          const pw = e.target.value;
          let score = 0;
          if (pw.length >= 8) score++;
          if (pw.length >= 12) score++;
          if (pw.length >= 16) score++;
          if (/[a-z]/.test(pw) && /[A-Z]/.test(pw)) score++;
          if (/\d/.test(pw)) score++;
          if (/[^a-zA-Z0-9]/.test(pw)) score++;
          const charsetSize = (/[a-z]/.test(pw) ? 26 : 0) + (/[A-Z]/.test(pw) ? 26 : 0) + (/\d/.test(pw) ? 10 : 0) + (/[^a-zA-Z0-9]/.test(pw) ? 32 : 0);
          const entropy = pw.length * Math.log2(charsetSize || 1);
          if (entropy >= 60) score++;
          if (entropy >= 80) score++;
          const labels = ['Very Weak', 'Weak', 'Fair', 'Good', 'Strong', 'Very Strong'];
          const colors = ['#ef4444', '#f97316', '#eab308', '#84cc16', '#22c55e', '#10b981'];
          const idx = Math.min(Math.floor(score / 1.5), labels.length - 1);
          const bar = document.getElementById('roomPwStrengthBar');
          const text = document.getElementById('roomPwStrengthText');
          bar.style.width = `${(score / 9) * 100}%`;
          bar.style.background = colors[idx];
          text.textContent = pw ? `${labels[idx]} (${Math.round(entropy)} bits)` : '';
          text.style.color = colors[idx];
        });
      },

       async initRoom() {

         try {
           // Compute room tag
           this.roomTag = await this.computeRoomTag(this.roomId, this.password);

           // Initialize media with retry logic
           let mediaInitialized = false;
           let mediaRetryCount = 0;

           while (!mediaInitialized && mediaRetryCount < maxMediaRetries) {
             try {
               await this.initMedia();
               mediaInitialized = true;
             } catch (mediaError) {
               mediaRetryCount++;
               console.warn(`Media initialization attempt ${mediaRetryCount} failed:`, mediaError);
               if (mediaRetryCount >= maxMediaRetries) {
                 throw mediaError;
               }
               // Wait 1 second before retrying
               await new Promise(resolve => setTimeout(resolve, 1000));
             }
           }

            // Initialize Nostr signaling
           this.signaling = NostrSignaling;
           console.log('Initializing signaling...');
           await this.signaling.init(this.roomId, this.password);
           console.log('Signaling initialized');

           // Get our pubkey

                // Relay forwarding: if we have children in the tree, forward this stream
                const ourNode = this.relayTree.tree[this.signaling?.nostr?.keys?.publicKey];
                if (ourNode && ourNode.children.length > 0) {
                  this.relayTree.startForwarding(data.peerId, data.stream);

              this.webrtc.on('peerDisconnected', (data) => {
                console.log('Peer disconnected:', data.peerId.slice(0, 16) + '...');
                this.removePeer(data.peerId);

              this.webrtc.on('connectionStateChange', (data) => {

                this.updatePeerStatus(data.peerId, data.state);
                this.addDebugMessage(`CONNECTION_STATE: ${data.peerId?.slice(0, 8)} - ${data.state}`);
              });

             // Peer timeout/disconnect handlers
             this.signaling.on('peerTimedOut', (data) => {
               console.log('Peer timed out:', data.pubkey.slice(0, 16));
               this.addDebugMessage(`PEER_TIMEOUT: ${data.pubkey.slice(0, 8)}`);
               this.removePeer(data.pubkey);
             });

             this.signaling.on('peerLeft', (data) => {
               console.log('Peer left room:', data.from.slice(0, 16));
               this.addDebugMessage(`PEER_LEFT: ${data.from.slice(0, 8)}`);
               this.removePeer(data.from);
             });

             this.signaling.on('nickname', (data) => {

             // Setup leave broadcast on page unload

            // Broadcast our presence
            console.log('Broadcasting presence...');
            await this.signaling.broadcastPresence();
            
            // Debug: Log relay tree
            console.log('Initial Relay Tree:');
            console.log(this.relayTree.getAsciiTree());

           this.setupEventListeners();
           this.updatePeerCount();
           this.saveSessionState();

           document.getElementById('loadingScreen').classList.add('hidden');
           document.getElementById('room').classList.remove('hidden');

         } catch (error) {
           console.error('Init error:', error);

           // Add a retry button to the error modal
           setTimeout(() => {
             const errorOkBtn = document.getElementById('errorOk');
             if (errorOkBtn) {
               errorOkBtn.textContent = 'Retry';

         }

       async computeRoomTag(roomId, password) {
        return ShuntCallCrypto.deriveNamespace(roomId, password);
      },

      async deriveEncryptionKey() {
        try {
          const keyMaterial = await crypto.subtle.importKey(
            'raw',
            new TextEncoder().encode(this.password),
            'PBKDF2',
            false,
            ['deriveKey']
          );
          this.encryptionKey = await crypto.subtle.deriveKey(
            {
              name: 'PBKDF2',
              salt: new TextEncoder().encode('shuntcall-e2e-' + this.roomId),
              iterations: 100000,
              hash: 'SHA-256'
            },
            keyMaterial,
            { name: 'AES-GCM', length: 256 },
            false,
            ['encrypt', 'decrypt']
          );
          console.log('E2E encryption key derived');
        } catch (error) {
          console.error('Failed to derive encryption key:', error);
        }
      },

      async encryptMessage(plaintext) {
        if (!this.encryptionKey) {
          console.error('Cannot encrypt: no encryption key available');
          return null;
        }
        try {
          const iv = crypto.getRandomValues(new Uint8Array(12));
          const encrypted = await crypto.subtle.encrypt(
            { name: 'AES-GCM', iv },
            this.encryptionKey,
            new TextEncoder().encode(plaintext)
          );
          const combined = new Uint8Array(iv.length + encrypted.byteLength);
          combined.set(iv);
          combined.set(new Uint8Array(encrypted), iv.length);
          return btoa(String.fromCharCode(...combined));
        } catch (error) {
          console.error('Encryption failed:', error);
          return null;
        }
      },

      async decryptMessage(ciphertext) {
        if (!this.encryptionKey) {
          return '[Decryption failed: no key]';
        }
        try {
          const combined = new Uint8Array(atob(ciphertext).split('').map(c => c.charCodeAt(0)));
          const iv = combined.slice(0, 12);
          const encrypted = combined.slice(12);
          const decrypted = await crypto.subtle.decrypt(
            { name: 'AES-GCM', iv },
            this.encryptionKey,
            encrypted
          );
          return new TextDecoder().decode(decrypted);
        } catch (error) {
          return '[Decryption failed]';
        }
      },

      saveSessionState() {
        try {
          sessionStorage.setItem('shuntcall_session', JSON.stringify({
            roomId: this.roomId,
            nickname: this.nickname,
            timestamp: Date.now()
          }));
        } catch (error) {
          console.warn('Failed to save session state:', error);
        }
      },

      restoreSessionState() {
        try {
          const session = JSON.parse(sessionStorage.getItem('shuntcall_session'));
          if (session && session.roomId === this.roomId && Date.now() - session.timestamp < 300000) {
            if (session.nickname) {
              this.nickname = session.nickname;
              const input = document.getElementById('nicknameInput');
              if (input) input.value = session.nickname;
              this.signaling.setNickname(session.nickname);
            }
            console.log('Session state restored');
          }
          sessionStorage.removeItem('shuntcall_session');
        } catch (error) {
          console.warn('Failed to restore session state:', error);
        }
      },

      showLoading(text) {
        document.getElementById('loadingText').textContent = text;
        document.getElementById('loadingScreen').classList.remove('hidden');
        document.getElementById('room').classList.add('hidden');
      },

        async initMedia() {
          const isSecure = window.location.protocol === 'https:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
          
          if (!isSecure) {
            throw new Error('System requires HTTPS or localhost for media access.');
          }

          this.supportedQualities = ['480p', '720p', '1080p', '1440p', '4k', '8k'];
          
          // Show media permission prompt
          this.showMediaPermissionModal();
          
          // Wait for user to confirm
          await new Promise((resolve, reject) => {
            this.mediaPermissionResolve = resolve;
            this.mediaPermissionReject = reject;
          });

          try {
            // Validate that at least one media type is enabled
            if (!this.mediaOptions.video && !this.mediaOptions.audio) {
              throw new Error('At least one media type (audio or video) must be enabled.');
            }

            const qualityMap = {
              '480p': { width: 854, height: 480 },
              '720p': { width: 1280, height: 720 },
              '1080p': { width: 1920, height: 1080 },
              '1440p': { width: 2560, height: 1440 },
              '4k': { width: 3840, height: 2160 },
              '8k': { width: 7680, height: 4320 }
            };
            const quality = this.mediaOptions.videoQuality || '720p';
            const videoSettings = qualityMap[quality] || qualityMap['720p'];

            this.localStream = await navigator.mediaDevices.getUserMedia({
              video: this.mediaOptions.video ? {
                ...(this.mediaOptions.videoDeviceId ? { deviceId: { exact: this.mediaOptions.videoDeviceId } } : {}),
                width: { ideal: videoSettings.width },
                height: { ideal: videoSettings.height },
                frameRate: { ideal: 30 }
              } : false,
              audio: this.mediaOptions.audio ? {
                ...(this.mediaOptions.audioDeviceId ? { deviceId: { exact: this.mediaOptions.audioDeviceId } } : {}),
                echoCancellation: true,
                noiseSuppression: true,
                autoGainControl: true
              } : false
            });

            const localVideo = document.getElementById('localVideo');
            
            // Check if this.localStream is a valid MediaStream object before setting srcObject
            if (this.localStream && typeof this.localStream === 'object' && 'getTracks' in this.localStream) {
              // Try to set srcObject - only works if we have a real MediaStream
              try {
                if (typeof this.localStream.getAudioTracks === 'function' && typeof this.localStream.getVideoTracks === 'function') {
                  localVideo.srcObject = this.localStream;
                  console.log('Media initialized');
                  
                  // Handle stream ended events
                  this.localStream.getTracks().forEach(track => {
                    track.onended = () => {
                      console.warn(`Media track ended: ${track.kind}`);
                      this.handleTrackEnded(track.kind);
                    };
                    
                    track.onerror = (error) => {
                      console.error(`Media track error: ${track.kind}`, error);
                      this.handleTrackEnded(track.kind);
                    };
                  });
                  
                  // Verify tracks are actually live
                  const audioTracks = this.localStream.getAudioTracks();
                  const videoTracks = this.localStream.getVideoTracks();
                  
                  audioTracks.forEach(track => {
                    if (track.readyState !== 'live') {
                      console.warn(`Audio track not live: ${track.readyState}`);
                    }
                  });
                  
                  videoTracks.forEach(track => {
                    if (track.readyState !== 'live') {
                      console.warn(`Video track not live: ${track.readyState}`);
                    }
                  });
                  
                  console.log(`Media tracks: ${audioTracks.length} audio, ${videoTracks.length} video`);
                  
                  this.detectWebcamCapabilities().then(() => {
                    this.populateLiveQualitySelector();
                  });
                } else {
                  console.warn('Mock stream detected - skipping srcObject assignment');
                }
              } catch (e) {
                console.warn('Failed to set video srcObject:', e.message);
              }
            } else {
              console.warn('No valid media stream available');
            }

          } catch (error) {
            console.error('Media error:', error);
            console.log('Creating mock stream fallback...');
            
            // Fallback: create mock stream for environments without camera
            try {
              const mockStream = new MediaStream();
              
              if (this.mediaOptions.video) {
                const canvas = document.createElement('canvas');
                canvas.width = 640;
                canvas.height = 480;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#111';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                const videoTrack = canvas.captureStream(30).getVideoTracks()[0];
                if (videoTrack) mockStream.addTrack(videoTrack);
              }
              
              if (this.mediaOptions.audio) {
                try {
                  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                  const oscillator = audioCtx.createOscillator();
                  const gain = audioCtx.createGain();
                  gain.gain.value = 0; // silent
                  const dest = audioCtx.createMediaStreamDestination();
                  oscillator.connect(gain);
                  gain.connect(dest);
                  oscillator.start();
                  const audioTrack = dest.stream.getAudioTracks()[0];
                  if (audioTrack) mockStream.addTrack(audioTrack);
                } catch (audioErr) {
                  console.warn('Mock audio creation failed:', audioErr);
                }
              }
              
              this.localStream = mockStream;
              const localVideo = document.getElementById('localVideo');
              localVideo.srcObject = mockStream;
              console.log('Mock stream created with', mockStream.getTracks().length, 'tracks');
              
              this.webcamCapabilities = { width: 640, height: 480, frameRate: 30 };
              this.supportedQualities = ['480p'];
              this.populateLiveQualitySelector();
            } catch (mockError) {
              console.error('Mock stream creation also failed:', mockError);
              this.showError('Hardware access error', error.message);
              throw error;
            }
          }
        },

        async detectWebcamCapabilities() {
          if (this.localStream && this.localStream.getVideoTracks().length > 0) {
            try {
              const videoTrack = this.localStream.getVideoTracks()[0];
              const settings = videoTrack.getSettings();
              
              this.webcamCapabilities = {
                width: settings.width || 1920,
                height: settings.height || 1080,
                frameRate: settings.frameRate || 30
              };
              
              console.log('Webcam capabilities from existing stream:', this.webcamCapabilities);
              
              const qualityOrder = ['8k', '4k', '1440p', '1080p', '720p', '480p'];
              const widthMap = { '480p': 854, '720p': 1280, '1080p': 1920, '1440p': 2560, '4k': 3840, '8k': 7680 };
              
              this.supportedQualities = qualityOrder.filter(q => widthMap[q] <= (this.webcamCapabilities.width || 1920));
              
              if (this.supportedQualities.length === 0) {
                this.supportedQualities = ['480p'];
              }
              
              console.log('Supported qualities (from stream):', this.supportedQualities);
            } catch (error) {
              console.warn('Error detecting capabilities from stream:', error);
              this.supportedQualities = ['480p', '720p', '1080p', '1440p', '4k', '8k'];
            }
            return;
          }
          
          try {
            const testStream = await navigator.mediaDevices.getUserMedia({
              video: { width: { ideal: 3840 }, height: { ideal: 2160 } },
              audio: false
            });
            
            const videoTrack = testStream.getVideoTracks()[0];
            const settings = videoTrack.getSettings();
            
            this.webcamCapabilities = {
              width: settings.width || 1920,
              height: settings.height || 1080,
              frameRate: settings.frameRate || 30
            };
            
            console.log('Webcam capabilities:', this.webcamCapabilities);
            
            const qualityOrder = ['8k', '4k', '1440p', '1080p', '720p', '480p'];
            const widthMap = { '480p': 854, '720p': 1280, '1080p': 1920, '1440p': 2560, '4k': 3840, '8k': 7680 };
            
            this.supportedQualities = qualityOrder.filter(q => widthMap[q] <= this.webcamCapabilities.width);
            
            if (this.supportedQualities.length === 0) {
              this.supportedQualities = ['480p'];
            }
            
            console.log('Supported qualities:', this.supportedQualities);
            
            testStream.getTracks().forEach(t => t.stop());
          } catch (error) {
            console.warn('Could not detect webcam capabilities, using defaults:', error);
            this.webcamCapabilities = { width: 1920, height: 1080, frameRate: 30 };
            this.supportedQualities = ['480p', '720p', '1080p', '1440p', '4k', '8k'];
          }
        },

        generateQualityOptions() {
          const qualityLabels = {
            '480p': '480p (854×480)',
            '720p': '720p (1280×720)',
            '1080p': '1080p (1920×1080)',
            '1440p': '1440p (2560×1440)',
            '4k': '4K (3840×2160)',
            '8k': '8K (7680×4320)'
          };
          
          const qualities = this.supportedQualities || ['720p'];
          const defaultQuality = qualities.includes('720p') ? '720p' : qualities[0];
          
          return qualities.map(q => 
            `<option value="${q}" ${q === defaultQuality ? 'selected' : ''}>${qualityLabels[q] || q}</option>`
          ).join('');
        },

        populateLiveQualitySelector() {
          const select = document.getElementById('liveQualitySelector');
          if (!select) return;
          
          const qualities = this.supportedQualities || this.webrtc?.getAvailableQualities() || ['720p'];
          const currentQuality = this.mediaOptions.videoQuality || '720p';
          
          select.innerHTML = qualities.map(q => 
            `<option value="${q}" ${q === currentQuality ? 'selected' : ''}>${q.toUpperCase()}</option>`
          ).join('');
        },

          document.body.appendChild(modal);
          
          this.mediaOptions = {
            video: true,
            audio: true,
            videoQuality: '720p',
            videoDeviceId: '',
            audioDeviceId: ''
          };

          // Preview stream for device picker
          let previewStream = null;
          let micAnalyser = null;
          let micAnimFrame = null;

          const startPreview = async () => {
            // Stop existing preview
            if (previewStream) {
              previewStream.getTracks().forEach(t => t.stop());
            }
            const constraints = {
              video: this.mediaOptions.video ? (this.mediaOptions.videoDeviceId ? { deviceId: { exact: this.mediaOptions.videoDeviceId } } : true) : false,
              audio: false
            };
            try {
              previewStream = await navigator.mediaDevices.getUserMedia(constraints);
              const previewEl = document.getElementById('devicePreview');
              const previewOff = document.getElementById('devicePreviewOff');
              if (previewEl) {
                previewEl.srcObject = previewStream;
                previewOff?.classList.add('hidden');
              }
            } catch (e) {
              const previewOff = document.getElementById('devicePreviewOff');
              previewOff?.classList.remove('hidden');
            }
          };

          const startMicLevel = async () => {
            if (micAnalyser) { micAnalyser = null; }
            const audioConstraints = {
              audio: this.mediaOptions.audio ? (this.mediaOptions.audioDeviceId ? { deviceId: { exact: this.mediaOptions.audioDeviceId } } : true) : false
            };
            try {
              const micStream = await navigator.mediaDevices.getUserMedia(audioConstraints);
              const audioCtx = new AudioContext();
              const source = audioCtx.createMediaStreamSource(micStream);
              micAnalyser = audioCtx.createAnalyser();
              micAnalyser.fftSize = 256;
              source.connect(micAnalyser);
              const dataArray = new Uint8Array(micAnalyser.frequencyBinCount);
              const levelEl = document.getElementById('micLevel');
              const labelEl = document.getElementById('micLevelLabel');
              const updateLevel = () => {
                if (!micAnalyser) return;
                micAnalyser.getByteFrequencyData(dataArray);
                const avg = dataArray.reduce((a, b) => a + b, 0) / dataArray.length;
                const pct = Math.min(100, (avg / 128) * 100);
                if (levelEl) levelEl.style.width = pct + '%';
                if (labelEl) labelEl.textContent = Math.round(pct) + '%';
                micAnimFrame = requestAnimationFrame(updateLevel);
              };
              updateLevel();
            } catch (e) {
              const labelEl = document.getElementById('micLevelLabel');
              if (labelEl) labelEl.textContent = 'N/A';
            }
          };

          // Enumerate devices
          const populateDevices = async () => {
            try {
              // Request permission first so labels appear
              try { await navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then(s => s.getTracks().forEach(t => t.stop())); } catch {}
              const devices = await navigator.mediaDevices.enumerateDevices();
              const cameras = devices.filter(d => d.kind === 'videoinput');
              const mics = devices.filter(d => d.kind === 'audioinput');
              
              const cameraSelect = document.getElementById('cameraSelect');
              const micSelect = document.getElementById('micSelect');
              
              if (cameraSelect) {
                cameraSelect.innerHTML = cameras.map((d, i) => 
                  `<option value="${d.deviceId}">${d.label || 'Camera ' + (i+1)}</option>`
                ).join('') || '<option value="">No camera found</option>';
              }
              if (micSelect) {
                micSelect.innerHTML = mics.map((d, i) => 
                  `<option value="${d.deviceId}">${d.label || 'Microphone ' + (i+1)}</option>`
                ).join('') || '<option value="">No microphone found</option>';
              }

              // Set initial device IDs
              if (cameras.length) this.mediaOptions.videoDeviceId = cameras[0].deviceId;
              if (mics.length) this.mediaOptions.audioDeviceId = mics[0].deviceId;

              // Start preview
              await startPreview();
              await startMicLevel();
            } catch (e) {
              console.warn('Device enumeration failed:', e);
            }
          };

          populateDevices();

          // Device change handlers
          document.getElementById('cameraSelect')?.addEventListener('change', (e) => {
            this.mediaOptions.videoDeviceId = e.target.value;
            startPreview();
          });
          document.getElementById('micSelect')?.addEventListener('change', (e) => {
            this.mediaOptions.audioDeviceId = e.target.value;
            startMicLevel();
          });

          // Toggle handlers
          document.getElementById('enableVideo').addEventListener('change', (e) => {
            this.mediaOptions.video = e.target.checked;
            const previewContainer = document.querySelector('.w-64');
            if (previewContainer) previewContainer.style.opacity = e.target.checked ? '1' : '0.3';
            startPreview();
          });
          document.getElementById('enableAudio').addEventListener('change', (e) => {
            this.mediaOptions.audio = e.target.checked;
            startMicLevel();
          });

          // Accept / Decline
          document.getElementById('mediaPermissionAccept').addEventListener('click', () => {
            // Stop preview streams
            if (previewStream) previewStream.getTracks().forEach(t => t.stop());
            if (micAnimFrame) cancelAnimationFrame(micAnimFrame);
            micAnalyser = null;
            modal.remove();
            this.mediaPermissionResolve();
          });
          
          document.getElementById('mediaPermissionDecline').addEventListener('click', () => {
            if (previewStream) previewStream.getTracks().forEach(t => t.stop());
            if (micAnimFrame) cancelAnimationFrame(micAnimFrame);
            micAnalyser = null;
            modal.remove();
            this.mediaPermissionReject(new Error('Hardware access denied by user.'));
          });
        },

       async handleDataChannelMessage(peerId, data) {
          if (data.type === 'mute-status') {
            this.peerMuteStates.set(peerId, {
              audioMuted: data.audioMuted,
              videoMuted: data.videoMuted
            });
            this.updatePeerMuteIndicator(peerId);
            this.addDebugMessage(`MUTE_STATUS: ${peerId.slice(0, 8)} audio=${data.audioMuted ? 'OFF' : 'ON'} video=${data.videoMuted ? 'OFF' : 'ON'}`);
           } else if (data.type === 'chat') {
             const message = await this.decryptMessage(data.message);
             const expiresAt = (data.expiry && data.expiry > 0) ? Date.now() + data.expiry * 1000 : null;
             this.addChatMessage(peerId, message, data.timestamp, expiresAt);
          } else if (data.type === 'file-offer') {
            this.handleFileOffer(peerId, data);
           } else if (data.type === 'file-chunk') {
             this.handleFileChunk(peerId, data);
           } else if (data.type === 'chat-clear') {
             this.chatMessages = [];
             this.renderChatMessages();
             this.addDebugMessage('CHAT_CLEARED by peer');
           }
        },

       updatePeerMuteIndicator(peerId) {
          const state = this.peerMuteStates.get(peerId);
          if (!state) return;
          const audioEl = document.getElementById(`mute-audio-${peerId}`);
          const videoEl = document.getElementById(`mute-video-${peerId}`);
          if (audioEl) audioEl.classList.toggle('hidden', !state.audioMuted);
          if (videoEl) videoEl.classList.toggle('hidden', !state.videoMuted);

        updatePeerNickname(peerId, nickname) {
          const peer = this.peers.get(peerId);
          if (peer) {
            peer.nickname = nickname;
          }
          // Store in nickname map for chat hot-reload
          this.peerNicknames.set(peerId, nickname);
          const nameEl = document.getElementById(`nickname-${peerId}`);
          if (nameEl) {
            nameEl.textContent = nickname;
          }
          // Re-render chat so existing messages show new name
          this.renderChatMessages();
          this.addDebugMessage(`NICKNAME: ${peerId.slice(0, 8)} → ${nickname}`);
        },

       addChatMessage(peerId, message, timestamp, expiresAt) {
         const time = timestamp || new Date().toISOString().split('T')[1].split('.')[0];
         const msgObj = { peerId, message, timestamp: time, expiresAt: expiresAt || null };
         this.chatMessages.push(msgObj);
         if (expiresAt) this.scheduleExpiry(msgObj);
         this.renderChatMessages();
         if (!this.chatOpen) {
           const badge = document.getElementById('chatBadge');
           if (badge) {
             badge.classList.remove('hidden');
             badge.textContent = parseInt(badge.textContent || '0') + 1;
           }
         }
       },

       scheduleExpiry(msgObj) {
         if (!msgObj.expiresAt) return;
         const delay = msgObj.expiresAt - Date.now();
         if (delay <= 0) return;
         setTimeout(() => {
           const idx = this.chatMessages.indexOf(msgObj);
           if (idx !== -1) {
             this.chatMessages.splice(idx, 1);
             this.renderChatMessages();
           }
         }, delay);
       },

       async sendChatMessage(message) {
          if (!message.trim()) return;
          const timestamp = new Date().toISOString().split('T')[1].split('.')[0];
          const encryptedMessage = await this.encryptMessage(message.trim());
          if (!encryptedMessage) {
            this.addChatMessage('self', '[Message not sent: encryption failed]', timestamp);
            return;
          }
          const expiry = this.chatExpiry;
          const data = { type: 'chat', message: encryptedMessage, timestamp, expiry };
          this.webrtc.broadcastData(data);
          const msgObj = { peerId: 'self', message: message.trim(), timestamp, expiresAt: expiry > 0 ? Date.now() + expiry * 1000 : null };
          this.chatMessages.push(msgObj);
          if (expiry > 0) this.scheduleExpiry(msgObj);
          this.renderChatMessages();
        },

       renderChatMessages() {
         const container = document.getElementById('chatMessages');
         if (!container) return;
         container.innerHTML = this.chatMessages.map(msg => {
           const isSelf = msg.peerId === 'self';
           // Look up current nickname dynamically (hot-reloadable)
           let label;
           if (isSelf) {
             label = this.nickname || 'You';
           } else {
             label = this.peerNicknames.get(msg.peerId) || msg.peerId.slice(0, 8) + '...';
           }
           return `<div class="mb-2 ${isSelf ? 'text-right' : ''}">
             <span class="text-[10px] text-neutral-500 font-mono">${msg.timestamp} ${this.escapeHtml(label)}</span>
             <div class="text-sm ${isSelf ? 'text-white bg-white/10' : 'text-neutral-300 bg-neutral-900'} inline-block px-3 py-1.5 rounded-sm mt-0.5 max-w-[85%] break-words">${this.escapeHtml(msg.message)}</div>
           </div>`;
         }).join('');
         container.scrollTop = container.scrollHeight;
       },

       renderRelayList() {
         const container = document.getElementById('relayList');
         if (!container || !this.signaling?.nostr) return;
         const relays = this.signaling.nostr.getAllRelays();
         container.innerHTML = relays.map(r => {

           const errs = r.health?.errors ? ` err:${r.health.errors}` : '';
           const latency = r.health?.lastMessage ? `${Math.round((Date.now() - r.health.lastMessage) / 1000)}s ago` : '';
           return `<div class="flex items-center justify-between py-1 border-b border-neutral-900">
             <div class="flex items-center gap-2 flex-1 min-w-0">
               <span class="w-1.5 h-1.5 rounded-full flex-shrink-0" style="background:${statusColor}"></span>
               <span class="text-[10px] truncate" title="${r.url}">${r.url.replace('wss://', '')}</span>
             </div>
             <div class="flex items-center gap-2 flex-shrink-0 ml-2">
               <span class="text-[9px] text-neutral-500">${msgs}${errs}</span>
               <span class="text-[9px]" style="color:${statusColor}">${statusText}</span>
             </div>
           </div>`;
         }).join('');
       },

       sendFile(file) {
          if (!file) return;
          if (!this.webrtc) {
            this.addFileCard('self', file.name, file.size, file.type, 'error', 'WebRTC not initialized');
            return;
          }
          
          // Check if any data channels are open
          const openChannels = Object.entries(this.webrtc.dataChannels || {})
            .filter(([, dc]) => dc.readyState === 'open');
          
          if (openChannels.length === 0) {
            this.addFileCard('self', file.name, file.size, file.type, 'queued', 'Waiting for peers...');
            this._pendingFile = file;
            return;
          }
          
          const CHUNK_SIZE = 4096;
          const fileId = crypto.getRandomValues(new Uint8Array(8)).reduce((s, b) => s + b.toString(16).padStart(2, '0'), '');
          const totalChunks = Math.ceil(file.size / CHUNK_SIZE);
          
          // Show sending card in chat
          this.addFileCard('self', file.name, file.size, file.type, 'sending', '0%', fileId);
          
          // Send file offer
          this.webrtc.broadcastData({
            type: 'file-offer',
            id: fileId,
            name: file.name,
            size: file.size,
            type: file.type,
            chunks: totalChunks
          });
          
          // Read and send chunks
          const reader = new FileReader();
          let offset = 0;
          let chunkIndex = 0;
          
          reader.onload = (e) => {
            const chunk = btoa(String.fromCharCode(...new Uint8Array(e.target.result)));
            const isLast = offset + CHUNK_SIZE >= file.size;
            
            this.webrtc.broadcastData({
              type: 'file-chunk',
              id: fileId,
              index: chunkIndex,
              data: chunk,
              last: isLast
            });
            
            chunkIndex++;
            offset += CHUNK_SIZE;
            
            // Update progress bar
            const pct = Math.min(100, Math.round((offset / file.size) * 100));
            this.updateFileCardProgress(fileId, pct + '%');
            
            if (offset < file.size) {
              setTimeout(() => readSlice(offset), 50);
            } else {
              this.updateFileCardProgress(fileId, 'Sent');
              this.addDebugMessage(`FILE_SENT: ${file.name} (${chunkIndex} chunks)`);
            }
          };
          
          reader.onerror = () => {
            this.updateFileCardProgress(fileId, 'Error');
            this.addDebugMessage(`FILE_ERROR: Failed to read ${file.name}`);
          };
          
          const readSlice = (off) => {
            reader.readAsArrayBuffer(file.slice(off, Math.min(off + CHUNK_SIZE, file.size)));
          };
          readSlice(0);
        },

        handleFileOffer(peerId, data) {
          this.fileTransfers.set(data.id, {
            meta: data,
            peerId,
            chunks: new Array(data.chunks),
            receivedIndices: new Set(),
            totalChunks: data.chunks
          });
          // Show receiving card
          this.addFileCard(peerId, data.name, data.size, data.type, 'receiving', '0%', data.id);
        },

        handleFileChunk(peerId, data) {
          const transfer = this.fileTransfers.get(data.id);
          if (!transfer) return;
          
          transfer.chunks[data.index] = data.data;
          transfer.receivedIndices.add(data.index);
          
          // Update progress
          const pct = Math.round((transfer.receivedIndices.size / transfer.totalChunks) * 100);
          this.updateFileCardProgress(data.id, pct + '%');
          
          if (data.last) {
            transfer.lastChunkReceived = true;
          }
          
          // Check if all chunks received (last chunk arrived + all indices present)
          if (transfer.lastChunkReceived && transfer.receivedIndices.size >= transfer.totalChunks) {
            // Reassemble
            try {
              const base64Str = transfer.chunks.join('');
              const binaryStr = atob(base64Str);
              const bytes = new Uint8Array(binaryStr.length);
              for (let i = 0; i < binaryStr.length; i++) {
                bytes[i] = binaryStr.charCodeAt(i);
              }
              const blob = new Blob([bytes], { type: transfer.meta.type || 'application/octet-stream' });
              const url = URL.createObjectURL(blob);
              
              // Update card to show download button
              this.updateFileCardDownload(data.id, url, transfer.meta.name, transfer.meta.size);
              this.fileTransfers.delete(data.id);
              this.addDebugMessage(`FILE_RECEIVED: ${transfer.meta.name} (${bytes.length} bytes)`);
            } catch (err) {
              this.updateFileCardProgress(data.id, 'Error');
              this.addDebugMessage(`FILE_REASSEMBLY_ERROR: ${err.message}`);
              console.error('File reassembly error:', err);
            }
          }
        },

        addFileCard(peerId, fileName, fileSize, fileType, status, statusText, fileId) {
          const container = document.getElementById('chatMessages');
          if (!container) return;
          
          const time = new Date().toISOString().split('T')[1].split('.')[0];
          const isSelf = peerId === 'self';
          const label = isSelf ? (this.nickname || 'You') : (this.peerNicknames.get(peerId) || peerId.slice(0, 8) + '...');
          const safeName = this.escapeHtml(fileName);
          const sizeStr = fileSize > 1048576 ? (fileSize / 1048576).toFixed(1) + ' MB' : (fileSize / 1024).toFixed(1) + ' KB';
          
          // File type icon
          const ext = fileName.split('.').pop()?.toLowerCase() || '';
          const iconMap = { mp3: '♪', wav: '♪', mp4: '▶', mov: '▶', avi: '▶', pdf: '📄', zip: '📦', rar: '📦', png: '🖼', jpg: '🖼', jpeg: '🖼', gif: '🖼', svg: '🖼', doc: '📝', docx: '📝', txt: '📝' };
          const icon = iconMap[ext] || '📎';
          
          const div = document.createElement('div');
          div.className = `mb-3 ${isSelf ? 'text-right' : ''}`;
          div.id = fileId ? `file-card-${fileId}` : undefined;
          
          const statusColor = status === 'sending' || status === 'receiving' ? 'text-blue-400' : status === 'done' ? 'text-green-400' : status === 'error' ? 'text-red-400' : 'text-neutral-400';
          const barVisible = status === 'sending' || status === 'receiving';
          
          div.innerHTML = `
            <span class="text-[10px] text-neutral-500 font-mono">${time} ${this.escapeHtml(label)}</span>
            <div class="inline-block max-w-[85%] mt-0.5 rounded-sm border border-neutral-800 bg-neutral-900/80 p-3 text-left">
              <div class="flex items-center gap-3">
                <span class="text-xl">${icon}</span>
                <div class="flex-1 min-w-0">
                  <div class="text-sm text-white truncate max-w-[200px]">${safeName}</div>
                  <div class="text-[10px] text-neutral-500 font-mono">${sizeStr}</div>
                </div>
              </div>
              ${barVisible ? `
              <div class="mt-2 h-1 bg-neutral-800 rounded-full overflow-hidden">
                <div class="file-progress-bar h-full bg-blue-500 transition-all duration-200" style="width:0%"></div>
              </div>
              <div class="text-[10px] font-mono ${statusColor} mt-1 file-status">${statusText}</div>
              ` : `
              <div class="text-[10px] font-mono ${statusColor} mt-1 file-status">${statusText}</div>
              `}
            </div>
          `;
          
          container.appendChild(div);
          container.scrollTop = container.scrollHeight;
        },

        updateFileCardProgress(fileId, text) {
          const card = document.getElementById(`file-card-${fileId}`);
          if (!card) return;
          const statusEl = card.querySelector('.file-status');
          const bar = card.querySelector('.file-progress-bar');
          if (statusEl) statusEl.textContent = text;
          if (bar) {
            const num = parseInt(text);
            if (!isNaN(num)) bar.style.width = num + '%';
          }
        },

        updateFileCardDownload(fileId, url, fileName, fileSize) {
          const card = document.getElementById(`file-card-${fileId}`);
          if (!card) return;
          
          const statusEl = card.querySelector('.file-status');
          const bar = card.querySelector('.file-progress-bar');
          
          if (bar) {
            bar.style.width = '100%';
            bar.classList.remove('bg-blue-500');
            bar.classList.add('bg-green-500');
          }
          
          if (statusEl) {
            statusEl.innerHTML = '';
            const link = document.createElement('a');
            link.href = url;
            link.download = fileName;
            link.className = 'text-green-400 hover:text-green-300 font-mono underline';
            link.textContent = '↓ Download';
            statusEl.appendChild(link);
          }
        },

       escapeHtml(text) {
         const div = document.createElement('div');
         div.textContent = text;
         return div.innerHTML;
       },

       broadcastMuteState() {
         if (!this.webrtc) return;
         this.webrtc.broadcastData({
           type: 'mute-status',
           audioMuted: !this.isAudioEnabled,
           videoMuted: !this.isVideoEnabled
         });
       },

       async getConnectionStats(peerId) {
         if (!this.webrtc) return null;
         const pc = this.webrtc.peerConnections[peerId];
         if (!pc) return null;
         try {
           const stats = await pc.getStats();
           const result = { roundTripTime: null, bytesReceived: 0, bytesSent: 0 };
           stats.forEach(report => {
             if (report.type === 'candidate-pair' && report.state === 'succeeded') {
               result.roundTripTime = report.currentRoundTripTime;
             }
             if (report.type === 'inbound-rtp' && !report.isRemote) {
               result.bytesReceived += report.bytesReceived || 0;
             }
             if (report.type === 'outbound-rtp' && !report.isRemote) {
               result.bytesSent += report.bytesSent || 0;
             }
           });
           return result;
         } catch (e) {
           return null;
         }
       },

       async updateConnectionQualityDisplay() {
         for (const [peerId] of this.peers) {
           const stats = await this.getConnectionStats(peerId);
           if (!stats) continue;
           const el = document.getElementById(`quality-${peerId}`);
           if (el) {
             if (stats.roundTripTime !== null) {
               const ms = Math.round(stats.roundTripTime * 1000);
               el.textContent = `${ms}ms`;
               el.className = 'text-[10px] font-mono ' + (ms < 100 ? 'text-green-400' : ms < 300 ? 'text-yellow-400' : 'text-red-400');
             }
           }
         }
       },

       setupEventListeners() {
          // Nickname input
          const nicknameInput = document.getElementById('nicknameInput');
          if (nicknameInput) {
            let nicknameTimeout;
            nicknameInput.addEventListener('input', (e) => {
              clearTimeout(nicknameTimeout);
              nicknameTimeout = setTimeout(() => {
                const name = e.target.value.trim();
                if (name && name !== this.nickname) {
                  this.nickname = name;
                  this.peerNicknames.set('self', name);
                  if (this.signaling) {
                    this.signaling.setNickname(name);
                  }
                  this.renderChatMessages();
                  this.saveSessionState();
                }
              }, 500);
            });
          }

          // File sharing button
          const shareFileBtn = document.getElementById('shareFile');
          if (shareFileBtn) {
            shareFileBtn.addEventListener('click', () => {
              const input = document.createElement('input');
              input.type = 'file';
              input.onchange = () => {
                if (input.files[0]) {
                  this.sendFile(input.files[0]);
                }
              };
              input.click();
            });
          }

          document.getElementById('toggleMic').addEventListener('click', (e) => {
           this.isAudioEnabled = !this.isAudioEnabled;
           this.localStream.getAudioTracks().forEach(track => {
             track.enabled = this.isAudioEnabled;
           });
           const btn = e.currentTarget;
           if(this.isAudioEnabled) {
             btn.classList.add('active', 'bg-white', 'text-black');
             btn.classList.remove('bg-transparent', 'text-white');
           } else {
             btn.classList.remove('active', 'bg-white', 'text-black');
             btn.classList.add('bg-transparent', 'text-white');
           }
           this.broadcastMuteState();
         });

          document.getElementById('toggleCamera').addEventListener('click', (e) => {
            this.isVideoEnabled = !this.isVideoEnabled;
           this.localStream.getVideoTracks().forEach(track => {
             track.enabled = this.isVideoEnabled;
           });
           const btn = e.currentTarget;
           if(this.isVideoEnabled) {
             btn.classList.add('active', 'bg-white', 'text-black');
             btn.classList.remove('bg-transparent', 'text-white');
           } else {
             btn.classList.remove('active', 'bg-white', 'text-black');
             btn.classList.add('bg-transparent', 'text-white');
           }
           this.broadcastMuteState();
         });

        document.getElementById('liveQualitySelector').addEventListener('change', async (e) => {
          const quality = e.target.value;
          console.log('Changing video quality to:', quality);
          if (this.webrtc) {
            const success = await this.webrtc.setVideoQuality(quality);
            if (success) {
              this.mediaOptions.videoQuality = quality;
              console.log('Video quality changed successfully to:', quality);
            } else {
              console.error('Failed to change video quality to:', quality);
              e.target.value = this.mediaOptions.videoQuality || '720p';
            }
          }
        });

        document.getElementById('toggleScreen').addEventListener('click', async () => {
          try {
            if (this.isScreenSharing) {
              // Stop screen sharing
              this.isScreenSharing = false;
              if (this.screenTrack) {
                this.screenTrack.stop();
                // Remove screen track from local stream
                this.localStream.removeTrack(this.screenTrack);
                this.screenTrack = null;
              }
              
              // Remove screen track from all peer connections
              if (this.webrtc) {
                Object.values(this.webrtc.peerConnections).forEach(pc => {
                  const screenSender = pc.getSenders().find(s => s.track && s.track.label?.toLowerCase().includes('screen'));
                  if (screenSender) {
                    pc.removeTrack(screenSender);
                  }
                });
              }
              
              // Remove screen share video element
              const screenVideo = document.getElementById('screenVideo');
              if (screenVideo) screenVideo.parentElement.remove();
              
              // Show camera in local preview again
              document.getElementById('localVideo').srcObject = this.localStream;
              document.getElementById('localContainer').classList.remove('hidden');
              document.getElementById('toggleScreen').classList.remove('bg-white', 'text-black');
              return;
            }
            
            // Start screen sharing — camera stays alive
            const screenStream = await navigator.mediaDevices.getDisplayMedia({
              video: { cursor: 'always' },
              audio: false
            });
            const screenTrack = screenStream.getVideoTracks()[0];
            this.screenTrack = screenTrack;
            this.isScreenSharing = true;
            
            // Add screen track to local stream (camera track stays!)
            this.localStream.addTrack(screenTrack);
            
            // Add screen track as new track to all peer connections (NOT replacing camera)
            if (this.webrtc) {
              Object.values(this.webrtc.peerConnections).forEach(pc => {
                pc.addTrack(screenTrack, this.localStream);
              });
            }
            
            // Create a separate video element for screen share in the video grid
            const grid = document.getElementById('videoGrid');
            const screenContainer = document.createElement('div');
            screenContainer.id = 'screenShareContainer';
            screenContainer.className = 'relative bg-neutral-900 border border-neutral-800 aspect-video group overflow-hidden rounded-sm col-span-full';
            screenContainer.innerHTML = `
              <video id="screenVideo" autoplay muted playsinline class="w-full h-full object-contain bg-black"></video>
              <div class="absolute top-3 right-3 flex items-center gap-2 bg-black/80 border border-neutral-700 px-3 py-1.5 rounded-sm backdrop-blur-md">
                <span class="w-2 h-2 bg-red-500 rounded-full animate-pulse"></span>
                <span class="text-[10px] font-mono text-white uppercase tracking-wider">Screen Share</span>
              </div>
              <div class="absolute inset-x-0 bottom-0 p-4 video-overlay flex justify-between items-end opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                <span class="text-[10px] text-neutral-400 font-mono">Camera is still active and streaming to peers</span>
              </div>
            `;
            grid.insertBefore(screenContainer, grid.firstChild);
            
            // Show screen in the new video element
            const screenVideo = document.getElementById('screenVideo');
            screenVideo.srcObject = screenStream;
            
            // Button highlight
            document.getElementById('toggleScreen').classList.add('bg-white', 'text-black');
            
            // Handle browser-native screen share stop button
            screenTrack.onended = () => {
              if (this.isScreenSharing) {
                this.isScreenSharing = false;
                this.screenTrack = null;
                this.localStream.removeTrack(screenTrack);
                
                if (this.webrtc) {
                  Object.values(this.webrtc.peerConnections).forEach(pc => {
                    const s = pc.getSenders().find(s => s.track === screenTrack);
                    if (s) pc.removeTrack(s);
                  });
                }
                
                const el = document.getElementById('screenShareContainer');
                if (el) el.remove();
                document.getElementById('localVideo').srcObject = this.localStream;
                document.getElementById('toggleScreen').classList.remove('bg-white', 'text-black');
              }
            };
          } catch (error) {
            console.error('Screen share error:', error);
            this.isScreenSharing = false;
          }
        });

        document.getElementById('togglePiP').addEventListener('click', async () => {
          const localVideo = document.getElementById('localVideo');
          try {
            if (!document.pictureInPictureEnabled) {
              console.log('PiP not supported');
              return;
            }
            if (document.pictureInPictureElement) {
              await document.exitPictureInPicture();
              document.getElementById('togglePiP').classList.remove('bg-white', 'text-black');
            } else if (localVideo.requestPictureInPicture) {
              await localVideo.requestPictureInPicture();
              document.getElementById('togglePiP').classList.add('bg-white', 'text-black');
            }
          } catch (error) {
            console.error('PiP error:', error);
          }
        });

        document.getElementById('toggleChat').addEventListener('click', () => {
          this.chatOpen = !this.chatOpen;
          const panel = document.getElementById('chatPanel');
          const badge = document.getElementById('chatBadge');
          if (this.chatOpen) {
            panel.classList.remove('translate-x-full');
            if (badge) badge.classList.add('hidden');
            const input = document.getElementById('chatInput');
            if (input) input.focus();
          } else {
            panel.classList.add('translate-x-full');
          }
        });

        document.getElementById('closeChat').addEventListener('click', () => {
          this.chatOpen = false;
          document.getElementById('chatPanel').classList.add('translate-x-full');
        });

        document.getElementById('clearChat').addEventListener('click', () => {
          this.chatMessages = [];
          this.renderChatMessages();
          if (this.webrtc) {
            this.webrtc.broadcastData({ type: 'chat-clear' });
          }
          this.addDebugMessage('CHAT_CLEARED');
        });

        const chatSend = () => {
          const input = document.getElementById('chatInput');
          if (input && input.value.trim()) {
            this.sendChatMessage(input.value);
            input.value = '';
          }
        };

        document.getElementById('chatSend').addEventListener('click', chatSend);
        document.getElementById('chatInput').addEventListener('keypress', (e) => {
          if (e.key === 'Enter') chatSend();
        });

        document.getElementById('chatExpiry').addEventListener('change', (e) => {
          this.chatExpiry = parseInt(e.target.value) || 0;
        });

        // Start connection quality polling
        this._qualityInterval = setInterval(() => {
          this.updateConnectionQualityDisplay();
        }, 5000);

        // Auto quality adjustment every 20 seconds
        this._autoQualityInterval = setInterval(async () => {
          if (this.webrtc && this.peers.size > 0) {
            const result = await this.webrtc.autoAdjustQuality();
            if (result?.changed) {
              this.addDebugMessage(`AUTO_QUALITY: ${result.direction} → ${result.quality} (RTT:${result.rtt.toFixed(0)}ms, loss:${result.loss.toFixed(1)}%)`);
              // Update selector UI
              const sel = document.getElementById('liveQualitySelector');
              if (sel) sel.value = result.quality;
              this.mediaOptions.videoQuality = result.quality;
            }
          }
        }, 20000);

        document.getElementById('leaveRoom').addEventListener('click', () => {
          this.leaveRoom();
        });

        // Relay panel toggle
        document.getElementById('toggleRelays').addEventListener('click', () => {
          document.getElementById('relayPanel').classList.toggle('hidden');
          this.renderRelayList();
        });

        // Relay list auto-refresh
        this._relayRefreshInterval = setInterval(() => {
          if (!document.getElementById('relayPanel').classList.contains('hidden')) {
            this.renderRelayList();
          }
        }, 5000);

        // Add custom relay
        document.getElementById('addRelayBtn').addEventListener('click', async () => {
          const input = document.getElementById('newRelayUrl');
          const url = input.value.trim();
          if (!url) return;
          try {
            if (this.signaling?.nostr) {
              const ok = await this.signaling.nostr.addCustomRelay(url);
              this.addDebugMessage(`RELAY_ADDED: ${url} (${ok ? 'connected' : 'failed'})`);
              input.value = '';
              this.renderRelayList();
            }
          } catch (err) {
            this.addDebugMessage(`RELAY_ERROR: ${err.message}`);
          }
        });

        // Screenshot/visibility protection
        document.addEventListener('visibilitychange', () => {
          const overlay = document.getElementById('screenshotOverlay');
          if (document.hidden) {
            overlay.style.display = 'flex';
          } else {
            overlay.style.display = 'none';
          }
        });

        document.addEventListener('keydown', (e) => {
          const tag = e.target.tagName;
          const isInput = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || e.target.isContentEditable;
          if ((e.key === 'd' || e.key === 'D') && !isInput) {
            document.getElementById('debugPanel').classList.toggle('hidden');
          }
          if (e.key === 'Escape') {
            this.chatOpen = false;
            document.getElementById('chatPanel').classList.add('translate-x-full');
          }
        });
      },

      leaveRoom() {
        if (this._qualityInterval) {
          clearInterval(this._qualityInterval);
        }
        if (this._autoQualityInterval) {
          clearInterval(this._autoQualityInterval);
        }
        if (this._relayRefreshInterval) {
          clearInterval(this._relayRefreshInterval);
        }
        if (this.signaling) {
          this.signaling.broadcastLeave();
          this.signaling.destroy();
        }
        if (this.relayTree) {
          this.relayTree.destroy();
        }
        if (this.webrtc) {
          this.webrtc.destroy();
        }
        if (this.localStream) {
          this.localStream.getTracks().forEach(track => track.stop());
        }
        window.location.href = 'index.html';
      }
    };

    document.addEventListener('DOMContentLoaded', () => {
      App.init();
    });
  </script>
</body>
</html>
